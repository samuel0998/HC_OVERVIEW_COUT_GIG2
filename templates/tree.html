{% extends 'base.html' %}
{% block title %}Tree | HC {{ active_fc_label }}{% endblock %}
{% block content %}
<div class="page-header">
    <a href="{{ url_for('hc.home') }}" class="btn back-btn btn-sm">&#8592; Início</a>
    <h2 class="page-title">Árvore Operacional</h2>
</div>

<div class="card" style="margin-bottom:16px;">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
        <div style="display:flex;align-items:center;gap:10px;">
            <label class="field-label" for="treeTurno" style="margin:0;">Turno</label>
            <select id="treeTurno" style="padding:8px 12px;border-radius:8px;border:1px solid var(--border);">
                {% for t in turnos %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
            </select>
        </div>
        <input type="search" id="treeBusca" placeholder="Buscar por nome ou login..." autocomplete="off"
               style="flex:1;min-width:200px;max-width:320px;padding:8px 12px;border-radius:8px;border:1px solid var(--border);">
        <div id="treeResumo" style="color:var(--muted);font-size:13px;"></div>
        <button id="treeBtnLimpar" class="btn-clear">Limpar filtros</button>
    </div>

    <div class="filter-hint" style="margin-top:10px;">Segure <kbd>Ctrl</kbd> e clique para selecionar vários valores no mesmo filtro.</div>

    <div style="display:flex;gap:28px;flex-wrap:wrap;margin-top:10px;">
        <div class="filter-group" style="min-width:220px;">
            <label>Status</label>
            <div id="treeFiltroStatus" class="filter-pills"></div>
        </div>
        <div class="filter-group" style="min-width:220px;">
            <label>Cargo</label>
            <div id="treeFiltroCargo" class="filter-pills"></div>
        </div>
        <div class="filter-group" style="flex:1;min-width:260px;">
            <label>Setor</label>
            <div id="treeFiltroSetor" class="filter-pills"></div>
        </div>
    </div>

    <p id="treeAviso" class="op-info" style="margin:10px 0 0;display:none;"></p>
</div>

<div id="treeRoot" class="tree-root-wrap">
    <div class="tree-root-node">🌳 Árvore por Setor</div>
    <div class="tree-spine"></div>
    <div id="treeBoard" class="tree-board"></div>
</div>

<script>
const treeTurno = document.getElementById('treeTurno');
const treeBusca = document.getElementById('treeBusca');
const treeBoard = document.getElementById('treeBoard');
const treeResumo = document.getElementById('treeResumo');
const treeAviso = document.getElementById('treeAviso');
const treeBtnLimpar = document.getElementById('treeBtnLimpar');

let podeMover = false;
let dadosAreas = {};       // último payload cru vindo da API (por área)
let filtroStatus = [];     // vazio = todos
let filtroCargo = [];      // vazio = todos
let filtroSetor = [];      // vazio = todos
let draggedId = null;
let draggedTurno = null;
let draggedAreaOrigem = null;

const STATUS_BADGE_CLASS = { OPERACIONAL: 'operacional', 'Treinamento': 'treinamento', 'Ausência': 'ausencia', 'LS': 'ls' };

function salvarTurnoPreferido(turno) {
    try { localStorage.setItem('tree_turno', turno); } catch (e) { /* ignore */ }
}
function turnoPreferido() {
    try { return localStorage.getItem('tree_turno'); } catch (e) { return null; }
}

function cardHtml(item, area) {
    const badgeCls = STATUS_BADGE_CLASS[item.status] || 'operacional';
    const podeArrastarEsteCard = podeMover && item.status === 'OPERACIONAL' && !!area && area !== 'SEM ÁREA';
    const extras = [];
    if (item.job) extras.push(`<span class="tree-card-tag">${item.job}</span>`);
    if (item.agencia) extras.push(`<span class="tree-card-tag">${item.agencia}</span>`);
    const retornarBtn = (item.status === 'LS' && podeMover)
        ? `<button type="button" class="link-btn" onclick="treeRetornarLS(event, ${item.id})">Retornar agora</button>`
        : '';
    return `
    <article class="tree-card" draggable="${podeArrastarEsteCard}" data-id="${item.id}" data-turno="${item.turno || ''}"
             ondragstart="treeDragStart(event, ${item.id}, '${(item.turno || '').replace(/'/g, "\\'")}', '${area.replace(/'/g, "\\'")}')"
             ondragend="treeDragEnd(event)">
        <div class="tree-card-top">
            <strong>${item.nome_completo}</strong>
            <span class="badge ${badgeCls}">${item.status}</span>
        </div>
        <div class="tree-card-meta">${item.cargo_exibicao || ''}${item.login ? ' · ' + item.login : ''}</div>
        ${extras.length ? `<div class="tree-card-extras">${extras.join('')}</div>` : ''}
        ${retornarBtn ? `<div class="tree-card-actions">${retornarBtn}</div>` : ''}
    </article>`;
}

function areaColHtml(area, itens) {
    return `
    <section class="tree-area-col" data-area="${area}"
             ondragover="treeAllowDrop(event)" ondragleave="treeDragLeave(event)" ondrop="treeDrop(event, '${area.replace(/'/g, "\\'")}')">
        <div class="tree-area-stem"></div>
        <h3 class="tree-area-title">${area} <span class="tree-area-count">${itens.length}</span></h3>
        <div class="tree-area-cards">
            ${itens.map(item => cardHtml(item, area)).join('') || '<p class="tree-area-empty">—</p>'}
        </div>
    </section>`;
}

// ── Filtros (status + setor, multi-seleção com Ctrl+clique - mesmo padrão do Dashboard) ──
function renderPills(containerId, valores, selecionados, aoMudar) {
    const el = document.getElementById(containerId);
    el.innerHTML = '';
    valores.forEach(v => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'filter-pill' + (selecionados.includes(v) ? ' active' : '');
        btn.textContent = v;
        btn.title = 'Ctrl+clique para selecionar vários';
        btn.onclick = (e) => {
            const multi = e.ctrlKey || e.metaKey;
            const jaSelecionado = selecionados.includes(v);
            if (multi) {
                aoMudar(jaSelecionado ? selecionados.filter(x => x !== v) : [...selecionados, v]);
            } else {
                aoMudar((jaSelecionado && selecionados.length === 1) ? [] : [v]);
            }
        };
        el.appendChild(btn);
    });
}

function atualizarFiltroStatus(nova) { filtroStatus = nova; renderizarFiltrosERender(); }
function atualizarFiltroCargo(nova) { filtroCargo = nova; renderizarFiltrosERender(); }
function atualizarFiltroSetor(nova) { filtroSetor = nova; renderizarFiltrosERender(); }

function renderizarFiltrosERender() {
    const todosItens = Object.values(dadosAreas).flat();
    const statusDisponiveis = [...new Set(todosItens.map(i => i.status))];
    const cargosDisponiveis = [...new Set(todosItens.map(i => i.cargo_exibicao).filter(Boolean))].sort();
    const setoresDisponiveis = Object.keys(dadosAreas);
    renderPills('treeFiltroStatus', statusDisponiveis, filtroStatus, atualizarFiltroStatus);
    renderPills('treeFiltroCargo', cargosDisponiveis, filtroCargo, atualizarFiltroCargo);
    renderPills('treeFiltroSetor', setoresDisponiveis, filtroSetor, atualizarFiltroSetor);
    renderizarBoard();
}

function renderizarBoard() {
    const busca = treeBusca.value.trim().toLowerCase();
    let totalExibido = 0;
    const colunas = Object.entries(dadosAreas)
        .filter(([area]) => !filtroSetor.length || filtroSetor.includes(area))
        .map(([area, itens]) => {
            const filtrados = itens.filter(item => {
                if (filtroStatus.length && !filtroStatus.includes(item.status)) return false;
                if (filtroCargo.length && !filtroCargo.includes(item.cargo_exibicao)) return false;
                if (busca) {
                    const alvo = `${item.nome_completo || ''} ${item.login || ''}`.toLowerCase();
                    if (!alvo.includes(busca)) return false;
                }
                return true;
            });
            return [area, filtrados];
        })
        .filter(([, itens]) => itens.length > 0);

    colunas.forEach(([, itens]) => { totalExibido += itens.length; });

    const totalGeral = Object.values(dadosAreas).flat().length;
    treeResumo.textContent = (totalExibido === totalGeral)
        ? `${totalGeral} colaborador(es) na operação · ${colunas.length} setor(es) com gente`
        : `${totalExibido} de ${totalGeral} colaborador(es) (filtro aplicado) · ${colunas.length} setor(es)`;

    if (!colunas.length) {
        treeBoard.innerHTML = '<p style="color:var(--muted);padding:20px;">Ninguém encontrado com esses filtros.</p>';
        return;
    }
    treeBoard.innerHTML = colunas.map(([area, itens]) => areaColHtml(area, itens)).join('');
}

async function carregarTree() {
    treeBoard.innerHTML = '<p style="color:var(--muted);padding:20px;">Carregando...</p>';
    try {
        const res = await fetch(`/api/hc/tree?turno=${encodeURIComponent(treeTurno.value)}`);
        const data = await res.json();
        if (!res.ok) { treeBoard.innerHTML = `<p style="color:red;padding:20px;">${data.erro || 'Erro ao carregar.'}</p>`; return; }

        podeMover = !!data.pode_mover;
        dadosAreas = data.areas || {};
        treeAviso.style.display = podeMover ? 'none' : 'block';
        if (!podeMover) treeAviso.textContent = 'Seu nível de acesso permite só visualizar a árvore - mover colaboradores exige LC3 ou superior.';

        // mantém só os valores de filtro que ainda existem nessa nova carga
        const todosItens = Object.values(dadosAreas).flat();
        filtroStatus = filtroStatus.filter(s => todosItens.some(i => i.status === s));
        filtroCargo = filtroCargo.filter(c => todosItens.some(i => i.cargo_exibicao === c));
        filtroSetor = filtroSetor.filter(a => a in dadosAreas);

        renderizarFiltrosERender();
    } catch (e) {
        console.error(e);
        treeBoard.innerHTML = '<p style="color:red;padding:20px;">Erro de comunicação ao carregar a árvore.</p>';
    }
}

treeTurno.addEventListener('change', () => { salvarTurnoPreferido(treeTurno.value); carregarTree(); });
treeBusca.addEventListener('input', renderizarBoard);
treeBtnLimpar.addEventListener('click', () => {
    filtroStatus = []; filtroCargo = []; filtroSetor = []; treeBusca.value = '';
    renderizarFiltrosERender();
});

// Retorno antecipado de um LS direto pela árvore - mesmo botão/endpoint que
// já existe no LIST (POST /api/hc/<id>/retornar-ls): devolve pro setor/
// escala de origem na hora, sem esperar a data marcada.
async function treeRetornarLS(e, id) {
    e.stopPropagation();
    if (!confirm('Retornar este colaborador do empréstimo (LS) agora, antes do prazo?')) return;
    try {
        const res = await fetch(`/api/hc/${id}/retornar-ls`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) { alert(data.erro || 'Erro ao retornar do LS.'); return; }
        carregarTree();
    } catch (err) {
        console.error(err);
        alert('Erro de comunicação ao retornar do LS.');
    }
}

function treeDragStart(e, id, turno, areaOrigem) {
    draggedId = id;
    draggedTurno = turno;
    draggedAreaOrigem = areaOrigem;
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', String(id)); } catch (err) { /* ignore */ }
    e.currentTarget.classList.add('dragging');
}
function treeDragEnd(e) {
    e.currentTarget.classList.remove('dragging');
    draggedId = null;
    draggedTurno = null;
    draggedAreaOrigem = null;
}
function treeAllowDrop(e) {
    e.preventDefault();
    e.currentTarget.classList.add('dragover');
}
function treeDragLeave(e) {
    e.currentTarget.classList.remove('dragover');
}

// Arrastar de um setor pra outro é sempre um empréstimo (LS) - precisa de
// data de retorno (mesma regra do LS feito pelo LIST: sem data de hoje, o
// retorno cai na próxima troca de turno do setor de origem automaticamente).
async function treeDrop(e, areaDestino) {
    e.preventDefault();
    e.currentTarget.classList.remove('dragover');
    const id = draggedId || parseInt(e.dataTransfer.getData('text/plain'), 10);
    const areaOrigem = draggedAreaOrigem;
    const turnoAtual = draggedTurno;
    if (!id) return;

    if (areaDestino === areaOrigem) return; // soltou na mesma coluna - nada a fazer

    if (areaDestino === 'SEM ÁREA') {
        alert('Não dá pra emprestar para "Sem área" - escolha um setor de destino.');
        return;
    }

    const hoje = new Date().toISOString().slice(0, 10);
    const dataRetorno = prompt(
        `Empréstimo (LS) de ${areaOrigem} para ${areaDestino}.\nData de retorno (se for hoje, volta sozinho na próxima troca de turno):`,
        hoje
    );
    if (!dataRetorno) return;

    try {
        const res = await fetch(`/api/hc/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                status: 'LS',
                ls_area_destino: areaDestino,
                ls_retorno_data: dataRetorno,
                turno: turnoAtual,
            }),
        });
        const data = await res.json();
        if (!res.ok) { alert(data.erro || 'Erro ao criar o empréstimo (LS).'); return; }
        carregarTree();
    } catch (err) {
        console.error(err);
        alert('Erro de comunicação ao mover colaborador.');
    }
}

(function iniciar() {
    const pref = turnoPreferido();
    if (pref && [...treeTurno.options].some(o => o.value === pref)) treeTurno.value = pref;
    carregarTree();
})();
</script>

<style>
.tree-root-wrap { display:flex; flex-direction:column; align-items:center; }
.tree-root-node {
    background: var(--primary); color: #fff; padding: 10px 26px; border-radius: 10px;
    font-weight: bold; letter-spacing: .5px; box-shadow: 0 4px 14px rgba(10,76,120,.25);
}
.tree-spine { width: 2px; height: 26px; background: var(--border); }

.tree-board {
    width: 100%;
    display: flex;
    gap: 22px;
    overflow-x: auto;
    padding: 10px 4px 20px;
    position: relative;
}
.tree-board::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--border);
}

.tree-area-col {
    min-width: 260px;
    max-width: 280px;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    padding-top: 18px;
    border-radius: 12px;
    transition: .15s;
}
.tree-area-stem { width: 2px; height: 18px; background: var(--border); align-self: center; margin-bottom: 8px; }
.tree-area-title {
    margin: 0 0 12px; text-align: center; color: var(--primary); font-size: 14px;
    font-weight: bold; letter-spacing: .5px; text-transform: uppercase;
    padding-bottom: 8px; border-bottom: 2px solid var(--primary);
    display: flex; align-items: center; justify-content: center; gap: 6px;
}
.tree-area-count {
    background: var(--primary); color: #fff; font-size: 11px; font-weight: bold;
    border-radius: 999px; padding: 1px 8px;
}
.tree-area-cards { display: flex; flex-direction: column; gap: 10px; min-height: 60px; }
.tree-area-empty { text-align: center; color: var(--muted); font-size: 12px; padding: 14px 0; }

.tree-area-col.dragover {
    background: #eaf2f8;
    outline: 2px dashed var(--primary);
    outline-offset: -2px;
}

.tree-card {
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; box-shadow: 0 1px 4px rgba(0,0,0,.05); cursor: grab;
    transition: .15s;
}
.tree-card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,.10); border-color: var(--primary); }
.tree-card[draggable="false"] { cursor: default; opacity: .92; }
.tree-card.dragging { opacity: .4; }
.tree-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.tree-card-top strong { font-size: 13px; color: var(--primary); }
.tree-card-meta { font-size: 12px; color: var(--muted); }
.tree-card-extras { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
.tree-card-tag {
    font-size: 11px; color: var(--muted); background: var(--bg-alt, #f3f6f9);
    border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px;
}
.tree-card-actions { margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--border); }
.tree-card-actions .link-btn { font-size: 12px; }

@media (max-width: 700px) {
    .tree-area-col { min-width: 220px; }
}
</style>
{% endblock %}
